
server.port=8082

spring.jwt.secret=${JWT_SECRET}
spring.jwt.expiration=900000

eureka.client.service-url.defaultZone=http://localhost:8010/eureka
#spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
#spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=users-status-check
spring.cloud.gateway.server.webflux.routes[0].uri=lb://users-ws

#
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/user/status/check
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[0].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthorizationHeaderFilter

# Login
spring.cloud.gateway.server.webflux.routes[1].id=users-login
spring.cloud.gateway.server.webflux.routes[1].uri=lb://users-ws
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/login
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=POST

# Todos
spring.cloud.gateway.server.webflux.routes[2].id=todos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://todos-ws
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/todos/**
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=GET,POST,PUT,DELETE
spring.cloud.gateway.server.webflux.routes[2].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthorizationHeaderFilter

# Register
spring.cloud.gateway.server.webflux.routes[3].id=users-register
spring.cloud.gateway.server.webflux.routes[3].uri=lb://users-ws
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/register
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=POST

# Delete
spring.cloud.gateway.server.webflux.routes[4].id=users-delete
spring.cloud.gateway.server.webflux.routes[4].uri=lb://users-ws
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/user
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Method=DELETE
spring.cloud.gateway.server.webflux.routes[4].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[4].filters[0]=AuthorizationHeaderFilter

# users-actuator
spring.cloud.gateway.server.webflux.routes[5].id=users-ws-actuator
spring.cloud.gateway.server.webflux.routes[5].uri=lb://users-ws
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/users-ws/actuator/**
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/users-ws/(?<segment>.*), /$\{segment}
# spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthorizationHeaderFilter

# todos-actuator
spring.cloud.gateway.server.webflux.routes[6].id=todos-ws-actuator
spring.cloud.gateway.server.webflux.routes[6].uri=lb://todos-ws
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/todos-ws/actuator/**
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/todos-ws/(?<segment>.*), /$\{segment}
# spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthorizationHeaderFilter
