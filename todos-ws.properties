# todos-ws
server.port=0

# Database
spring.datasource.url=jdbc:mysql://mysqldb:3306/tododb?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
spring.jwt.secret=${JWT_SECRET}
spring.jwt.expiration=900000

# Eureka
eureka.client.serviceUrl.defaultZone=http://discovery-server:8010/eureka
#eureka.instance.prefer-ip-address=true
#eureka.instance.ip-address=127.0.0.1

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=todos-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
