# users-ws
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://mysqldb:3306/tododb?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/docs

# JWT
spring.jwt.secret=${JWT_SECRET}
spring.jwt.expiration=900000

# Eureka
eureka.client.serviceUrl.defaultZone=http://discovery-server:8010/eureka
#eureka.instance.prefer-ip-address=true
#eureka.instance.ip-address=127.0.0.1

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=120000

#Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Health details
management.endpoint.health.show-details=always

# Kubernetes probes
management.endpoint.health.probes.enabled=true

# Application info
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Spring Cloud Microservice
info.app.version=1.0.0
